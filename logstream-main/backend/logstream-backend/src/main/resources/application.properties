spring.application.name=logstream-backend

server.port=8080

# ------------------------------------------------------------------
# PostgreSQL (relational metadata only; search lives in Lucene)
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/logstream
spring.datasource.username=postgres
spring.datasource.password=newpass123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------
# Actuator
# ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------------
# Lucene index tuning (see docs/INDEXING_STRATEGY.md §3.4)
#   One writer + one cached reader per tenant.
#   Ingestion buffers up to ram-buffer-mb / max-buffered-docs before a
#   flush; IndexFlushScheduler commits every second.
# ------------------------------------------------------------------
logstream.index.path=logs/lucene-index
logstream.index.ram-buffer-mb=128
logstream.index.max-buffered-docs=50000

# ------------------------------------------------------------------
# gRPC ingestion
#   require-tenant=true enforces a tenant-id metadata key on writes.
# ------------------------------------------------------------------
logstream.grpc.port=9090
logstream.grpc.require-tenant=false

# ------------------------------------------------------------------
# Email alerting
# ------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=logstreamteam@gmail.com
spring.mail.password=zzxc jibt datk kusa
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

alert.email.to=logstreamteam@gmail.com

# ------------------------------------------------------------------
# Dev data seeding
#   When true, DevDataSeeder injects a multi-tenant sample dataset
#   through the real ingestion path so the dashboard is not empty on a
#   fresh install. Leave false (or remove) in production.
# ------------------------------------------------------------------
logstream.dev.seed=true
